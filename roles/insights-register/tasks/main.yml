---
- name: include rh_sm_creds
  include_vars:
    file: ../../../ansible_global_vars/secret_vars/rh_sm_creds.yml
  when:
    work_server == true

- name: include ct_sm_creds
  include_vars:
    file: ../../../ansible_global_vars/secret_vars/ct_sm_creds.yml
  when:
    personal_server == true

- name: Install Packages for Insights
  ansible.builtin.package:
    name: insights-client
    state: present
  when:
    - ansible_distribution == "RedHat"
    - ansible_distribution_major_version >= "6"

- name: register for insights
  ansible.builtin.command: insights-client --register
  when:
    - ansible_distribution == "RedHat"
    - ansible_distribution_major_version >= "6"

